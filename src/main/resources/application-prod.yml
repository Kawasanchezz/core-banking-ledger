# Perfil de produção: TODOS os segredos vêm de variáveis de ambiente (sem valores padrão).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

bank:
  jwt:
    secret: ${JWT_SECRET}
  account:
    checking-overdraft-limit: ${CHECKING_OVERDRAFT_LIMIT:0.00}

logging:
  structured:
    format:
      console: ecs          # logs JSON estruturados (inclui o MDC: correlationId)
