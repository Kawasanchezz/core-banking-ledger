spring:
  application:
    name: core-banking
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

bank:
  account:
    agency: "0001"
    checking-overdraft-limit: 0.00
  idempotency:
    ttl: PT24H
    cleanup-interval: PT1H
  reconciliation:
    cron: "0 0 3 * * *"
  scheduling:
    enabled: true
  jwt:
    expiration-minutes: 60
